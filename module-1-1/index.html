<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Module 1.1 Jeopardy — Final Review</title>
<style>
  :root {
    --teal: #1F4E5F;
    --teal-dark: #163a47;
    --green: #2E7D6E;
    --orange: #C9720C;
    --bg: #0f2530;
    --card: #17384a;
    --card-done: #0a1b23;
    --text: #f4f7f8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Calibri, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 18px 28px 10px;
    text-align: center;
  }
  header h1 {
    margin: 0;
    font-size: 30px;
    letter-spacing: 0.5px;
    color: #fff;
  }
  header p {
    margin: 4px 0 0;
    color: #9fc2c9;
    font-size: 14px;
  }
  #scoreboard {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
    padding: 10px 20px 6px;
  }
  .team {
    background: var(--card);
    border-radius: 10px;
    padding: 10px 16px;
    min-width: 150px;
    text-align: center;
    border: 2px solid transparent;
  }
  .team input.teamname {
    background: transparent;
    border: none;
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    text-align: center;
    width: 100%;
    border-bottom: 1px dashed #3d6a78;
    padding-bottom: 3px;
  }
  .team .score {
    font-size: 30px;
    font-weight: 800;
    color: var(--orange);
    margin: 6px 0;
  }
  .team .buttons { display: flex; gap: 6px; justify-content: center; }
  .team button {
    background: var(--green);
    border: none;
    color: #fff;
    border-radius: 6px;
    padding: 5px 9px;
    font-size: 13px;
    cursor: pointer;
  }
  .team button.minus { background: #7a3b3b; }
  .team button:hover { filter: brightness(1.15); }

  #board {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    padding: 16px 24px 8px;
    max-width: 1250px;
    margin: 0 auto;
  }
  .cat-header {
    background: var(--teal-dark);
    color: #fff;
    text-align: center;
    padding: 12px 6px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 15px;
    line-height: 1.25;
    min-height: 54px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cell {
    background: var(--card);
    border: none;
    color: var(--orange);
    font-size: 26px;
    font-weight: 800;
    border-radius: 8px;
    padding: 20px 0;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.2s ease;
  }
  .cell:hover { transform: scale(1.04); background: var(--teal); }
  .cell.done {
    background: var(--card-done);
    color: #33484f;
    cursor: default;
  }
  .cell.done:hover { transform: none; background: var(--card-done); }

  #resetRow { text-align: center; padding: 14px; }
  #resetRow button {
    background: #333;
    color: #ddd;
    border: 1px solid #555;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }

  /* Modal */
  #overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.82);
    align-items: center;
    justify-content: center;
    z-index: 10;
    padding: 20px;
  }
  #modal {
    background: linear-gradient(180deg, #1c4356, #122c38);
    border-radius: 16px;
    max-width: 780px;
    width: 100%;
    padding: 40px 44px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    border: 1px solid #2c5d70;
  }
  #modalCat {
    color: var(--orange);
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-size: 14px;
    margin-bottom: 6px;
  }
  #modalPoints {
    color: #9fc2c9;
    font-size: 14px;
    margin-bottom: 18px;
  }
  #modalQuestion {
    font-size: 26px;
    font-weight: 600;
    line-height: 1.4;
    margin-bottom: 22px;
  }
  #modalAnswer {
    display: none;
    font-size: 22px;
    color: #8fe3c7;
    font-weight: 700;
    margin-bottom: 22px;
    padding-top: 18px;
    border-top: 1px solid #2c5d70;
  }
  #modal button {
    background: var(--green);
    color: #fff;
    border: none;
    padding: 12px 26px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin: 4px;
  }
  #modal button.close { background: #555; }
  #modal button:hover { filter: brightness(1.12); }
</style>
</head>
<body>

<header>
  <h1>Module 1.1 — Final Review</h1>
  <p>Pick a category and a point value. Teams answer out loud; you decide who scores.</p>
</header>

<div id="scoreboard"></div>

<div id="board"></div>

<div id="resetRow"><button onclick="resetBoard()">Reset board (new class / re-run)</button></div>

<div id="overlay">
  <div id="modal">
    <div id="modalCat"></div>
    <div id="modalPoints"></div>
    <div id="modalQuestion"></div>
    <div id="modalAnswer"></div>
    <div>
      <button id="showAnswerBtn" onclick="showAnswer()">Show answer</button>
      <button class="close" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

<script>
const DATA = {
  "Devices + Basics": {
    100: { q: "What do we call any device that sends or receives data on a network (e.g. a laptop or phone)?", a: "A host" },
    200: { q: "What's the difference between a client and a server?", a: "A client requests services; a server provides them" },
    300: { q: "What does NIC stand for?", a: "Network Interface Card" },
    400: { q: "Name one thing an intermediary device like a router or switch does.", a: "Routes data / regenerates signals / prioritises traffic / detects errors / enforces security (any one)" },
  },
  "Network Design + Types": {
    100: { q: "What does LAN stand for?", a: "Local Area Network" },
    200: { q: "What does WAN stand for, and what's the largest example of one?", a: "Wide Area Network — the internet" },
    300: { q: "What makes a network 'scalable'?", a: "It can grow (more users/services) without losing performance" },
    400: { q: "What does QoS prioritise, and why?", a: "Time-sensitive traffic like voice or video, so it isn't delayed" },
  },
  "Security": {
    100: { q: "Name the three parts of the CIA triad.", a: "Confidentiality, Integrity, Availability" },
    200: { q: "What does a Denial of Service (DoS) attack do?", a: "Overloads a system so real users can't access it" },
    300: { q: "What's the difference between a virus and spyware?", a: "A virus infects and spreads, causing damage; spyware secretly collects data" },
    400: { q: "Name one advanced corporate security tool beyond antivirus and a basic firewall.", a: "ACLs / IPS / VPN / dedicated firewall systems (any one)" },
  },
  "Protocols + OSI Layers": {
    100: { q: "Name the 7 layers of the OSI model, top to bottom.", a: "Application, Presentation, Session, Transport, Network, Data Link, Physical" },
    200: { q: "What's the PDU (data unit name) at the Transport layer?", a: "A segment" },
    300: { q: "What's the PDU at the Network layer?", a: "A packet" },
    400: { q: "What's the difference between encapsulation and de-encapsulation?", a: "Encapsulation adds headers going down the stack when sending; de-encapsulation strips them going back up when receiving" },
  },
  "Cisco + Commands": {
    100: { q: "What symbol marks Privileged EXEC mode in Cisco IOS?", a: "#" },
    200: { q: "Where does running-config live, and what happens to it on reboot if you don't save?", a: "RAM — it's lost" },
    300: { q: "Where is startup-config stored?", a: "NVRAM" },
    400: { q: "What command tests connectivity between two devices?", a: "ping" },
  },
};

const CATS = Object.keys(DATA);
const POINTS = [100, 200, 300, 400];
let teams = [
  { name: "Team 1", score: 0 },
  { name: "Team 2", score: 0 },
  { name: "Team 3", score: 0 },
  { name: "Team 4", score: 0 },
];
let current = null;

function renderScoreboard() {
  const el = document.getElementById("scoreboard");
  el.innerHTML = "";
  teams.forEach((t, i) => {
    const div = document.createElement("div");
    div.className = "team";
    div.innerHTML = `
      <input class="teamname" value="${t.name}" onchange="renameTeam(${i}, this.value)">
      <div class="score">${t.score}</div>
      <div class="buttons">
        <button onclick="adjustScore(${i}, 100)">+100</button>
        <button onclick="adjustScore(${i}, -100)" class="minus">-100</button>
      </div>`;
    el.appendChild(div);
  });
}
function renameTeam(i, val) { teams[i].name = val || teams[i].name; }
function adjustScore(i, amt) { teams[i].score += amt; renderScoreboard(); }

function renderBoard() {
  const board = document.getElementById("board");
  board.innerHTML = "";
  CATS.forEach(cat => {
    const h = document.createElement("div");
    h.className = "cat-header";
    h.textContent = cat;
    board.appendChild(h);
  });
  POINTS.forEach(pts => {
    CATS.forEach(cat => {
      const btn = document.createElement("button");
      const done = DATA[cat][pts].done;
      btn.className = "cell" + (done ? " done" : "");
      btn.textContent = done ? "✓" : pts;
      btn.onclick = () => openQuestion(cat, pts);
      board.appendChild(btn);
    });
  });
}

function openQuestion(cat, pts) {
  if (DATA[cat][pts].done) return;
  current = { cat, pts };
  document.getElementById("modalCat").textContent = cat;
  document.getElementById("modalPoints").textContent = pts + " points";
  document.getElementById("modalQuestion").textContent = DATA[cat][pts].q;
  const ansEl = document.getElementById("modalAnswer");
  ansEl.style.display = "none";
  ansEl.textContent = "Answer: " + DATA[cat][pts].a;
  document.getElementById("showAnswerBtn").style.display = "inline-block";
  document.getElementById("overlay").style.display = "flex";
}
function showAnswer() {
  document.getElementById("modalAnswer").style.display = "block";
  document.getElementById("showAnswerBtn").style.display = "none";
}
function closeModal() {
  if (current) {
    DATA[current.cat][current.pts].done = true;
    current = null;
  }
  document.getElementById("overlay").style.display = "none";
  renderBoard();
}
function resetBoard() {
  if (!confirm("Reset all questions and scores?")) return;
  CATS.forEach(cat => POINTS.forEach(pts => { delete DATA[cat][pts].done; }));
  teams = [
    { name: "Team 1", score: 0 },
    { name: "Team 2", score: 0 },
    { name: "Team 3", score: 0 },
    { name: "Team 4", score: 0 },
  ];
  renderScoreboard();
  renderBoard();
}

renderScoreboard();
renderBoard();
</script>
</body>
</html>
